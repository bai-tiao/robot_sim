# =============================================================
# global_planner_params.yaml — 全局规划器参数（仿真版）
# =============================================================
# 与 dualmap_nav/src/lio_map_align/config/global_params.yaml 保持一致
#
# 地图策略（与 dualmap 原版一致）：
#   静态底图: map_server 加载 blank_map.yaml (100x100m空白)
#   实时障碍: obstacle_layer 订阅 /scan，动态标识障碍物
# 这样不论机器人在哪里都在地图范围内，永远不会 out of bounds
# =============================================================

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: true
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: false
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        always_send_full_costmap: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.15
        cost_scaling_factor: 3.0
