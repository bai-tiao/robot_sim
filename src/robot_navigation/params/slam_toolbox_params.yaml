# slam_toolbox 在线异步建图参数
# 文档: https://github.com/SteveMacenski/slam_toolbox
#
# 模式切换（通过修改下方两个参数）：
#
# ground_truth 模式（默认，纯建图）:
#   use_scan_matching: false
#   publish_map_odom_transform: false
#   定位完全来自 isaac_scene.py ground truth
#   slam 只负责绯制地图 /map，不参与定位
#
# slam 模式（模拟真实机器人定位链路）:
#   use_scan_matching: true
#   publish_map_odom_transform: true
#   slam_toolbox 发布 map→odom TF，islam_pose_bridge 转为 /state_estimation
#   isaac_scene.py 环境变量 ISAAC_LOCALIZATION_MODE=slam 时不发布 map→odom identity TF
slam_toolbox:
  ros__parameters:
    # 使用异步模式，减少延迟
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # 话题 / TF
    odom_frame: odom          # Isaac: odom→base_footprint
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    publish_map_odom_transform: false  # Isaac 直接发布 ground truth map→odom，不需要 SLAM 修正

    use_map_saver: true
    mode: mapping

    # ★ 关键：关闭 scan matching，纯用俿真地面真値位姿建图
    # 地图完全由俿真提供的 odom→base_footprint (ground truth) 决定
    use_scan_matching: false
    do_loop_closing: false

    # 分辨率与范围
    resolution: 0.05
    # map_start_at_dock: true  会把机器人放在地图像素(0,0)即左下角，导致可视化里机器人在彩色方块右下角
    # map_start_at_dock: false 让 slam_toolbox 把机器人放在地图中心，四周都有足够空间，不会出界
    map_start_at_dock: false
    max_laser_range: 20.0
    min_laser_range: 0.1
    minimum_time_interval: 0.3       # 降低频率要求，确保小车慢走时也能建图
    transform_timeout: 2.0           # 等待 TF 的超时（秒），必须大于一帧时间
    tf_buffer_duration: 60.0
    stack_size_to_use: 40000000

    # 其他扫描匹配相关参数（use_scan_matching=false 时这些不生效）
    enable_interactive_mode: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.5  # m, 最小移动距离才更新
    minimum_travel_heading: 0.5   # rad
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    # do_loop_closing 已在上方关闭
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
